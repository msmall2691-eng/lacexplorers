<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arrowhead Explorers logo">
  <!--
    PLACEHOLDER LOGO for Arrowhead Explorers.
    Meg: replace this file with your real logo to update the site everywhere.
      • Easiest: save your logo as /public/logo.svg (overwrite this file), OR
      • Drop your 2048px PNG in /public (e.g. /public/logo.png) and change
        LOGO_SRC in components/Logo.tsx to "/logo.png".
    See the README ("Replacing the logo & photos") for details.
  -->
  <defs>
    <clipPath id="ae-emblem-clip">
      <circle cx="60" cy="60" r="54" />
    </clipPath>
  </defs>

  <!-- Emblem ring -->
  <circle cx="60" cy="60" r="56" fill="#F7F3EB" stroke="#6F7A55" stroke-width="3" />

  <g clip-path="url(#ae-emblem-clip)">
    <!-- Sky -->
    <rect x="4" y="4" width="112" height="112" fill="#FCFBF8" />

    <!-- Sun -->
    <circle cx="87" cy="35" r="9" fill="#E1D3B8" />

    <!-- Back hill -->
    <path d="M2 82 C 26 68 46 79 66 75 C 90 70 106 80 118 76 L118 118 L2 118 Z" fill="#AEB89A" />

    <!-- Evergreen trees -->
    <g fill="#59623F">
      <rect x="24.5" y="80" width="3" height="9" fill="#9C8567" />
      <path d="M26 55 l-6 12 h12 Z" />
      <path d="M26 62 l-8 14 h16 Z" />
      <path d="M26 70 l-10 16 h20 Z" />
      <rect x="42.5" y="82" width="2.6" height="8" fill="#9C8567" />
      <path d="M44 64 l-5 10 h10 Z" />
      <path d="M44 70 l-6.5 12 h13 Z" />
      <path d="M44 77 l-8 13 h16 Z" />
    </g>

    <!-- Front hill -->
    <path d="M2 93 C 30 81 56 93 80 89 C 98 86 110 93 118 91 L118 118 L2 118 Z" fill="#6F7A55" />

    <!-- Cottage -->
    <g>
      <rect x="58" y="80" width="24" height="19" fill="#E7DCC8" />
      <path d="M54.5 82 L70 68 L85.5 82 Z" fill="#59623F" />
      <rect x="66" y="89" width="7" height="10" rx="0.5" fill="#6F7A55" />
      <rect x="60.5" y="84.5" width="5" height="5" rx="0.5" fill="#AEB89A" />
      <!-- Heart in the gable -->
      <path d="M70 79 C 66.8 76 66 74 68 72.8 C 69.1 72.1 70 72.7 70 73.4 C 70 72.7 70.9 72.1 72 72.8 C 74 74 73.2 76 70 79 Z" fill="#F7F3EB" />
    </g>

    <!-- Little leaf accent -->
    <g stroke="#6F7A55" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M96 96 C 96 88 101 84 108 84 C 108 92 103 96 96 96 Z" fill="#AEB89A" stroke="none" />
      <path d="M99 93 c 2 -2 4 -3 6 -3.6" />
    </g>
  </g>
</svg>
